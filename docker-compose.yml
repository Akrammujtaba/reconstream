# ReconStream local stack.
#   docker compose up -d --build      start everything (first build takes ~10 min)
#   docker compose ps                 check health
#   docker compose down -v            stop and delete all data
name: reconstream

x-lake-env: &lake-env
  TZ: UTC
  ICEBERG_CATALOG: lake
  ICEBERG_JDBC_URI: jdbc:postgresql://postgres:5432/iceberg
  ICEBERG_JDBC_USER: recon
  ICEBERG_JDBC_PASSWORD: recon
  ICEBERG_WAREHOUSE: s3://lake/warehouse
  S3_ENDPOINT: http://s3:8333
  AWS_ACCESS_KEY_ID: reconstream
  AWS_SECRET_ACCESS_KEY: reconstream-secret
  AWS_REGION: us-east-1
  KAFKA_BOOTSTRAP: kafka:9092
  PUSHGATEWAY_URL: pushgateway:9091
  RECON_SLA_MINUTES: ${RECON_SLA_MINUTES:-2}
  # Optional per-currency overrides, e.g. "INR=5,EUR=3". Unlisted currencies use the default.
  RECON_SLA_MINUTES_BY_CURRENCY: ${RECON_SLA_MINUTES_BY_CURRENCY:-}
  # Refund vs. capture differences up to this many cents are not flagged (0 = exact match).
  RECON_REFUND_TOLERANCE_CENTS: ${RECON_REFUND_TOLERANCE_CENTS:-0}
  RECON_ALLOWED_LATENESS_SECONDS: "30"
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}

services:
  # ---------- sources ----------
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: recon
      POSTGRES_PASSWORD: recon
      POSTGRES_DB: bookings
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4",
              "-c", "max_wal_senders=4"]
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recon -d bookings"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      # Persist topics across `docker compose down` so Spark's checkpointed offsets stay valid.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    ports: ["29092:29092"]
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for t in pg.public.bookings payments.raw; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1
        done
        for t in payments.dlq recon.alerts; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$t --partitions 1 --replication-factor 1
        done
    restart: "no"

  connect:
    image: debezium/connect:2.7.3.Final
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: reconstream-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
    ports: ["8083:8083"]
    healthcheck:
      # bash's /dev/tcp avoids depending on curl being in the image
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8083'"]
      interval: 10s
      retries: 30

  connect-init:
    image: curlimages/curl:8.10.1
    depends_on:
      connect: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
    volumes:
      - ./infra/debezium/bookings-connector.json:/config/bookings-connector.json:ro
    command: ["-sf", "-X", "PUT", "-H", "Content-Type: application/json",
              "--data", "@/config/bookings-connector.json",
              "http://connect:8083/connectors/bookings-cdc/config"]
    restart: on-failure

  webhook:
    build: ./services/webhook
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-secret}
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 10

  # ---------- lakehouse ----------
  # S3-compatible object storage for the Iceberg tables (SeaweedFS).
  s3:
    image: chrislusf/seaweedfs:4.28
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333",
              "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=1024"]
    ports: ["8333:8333", "8888:8888"]
    volumes:
      - s3data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  s3-init:
    image: amazon/aws-cli:2.38.4
    depends_on: [s3]
    environment:
      AWS_ACCESS_KEY_ID: reconstream
      AWS_SECRET_ACCESS_KEY: reconstream-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        aws configure set default.s3.addressing_style path
        for i in $$(seq 1 90); do
          aws --endpoint-url http://s3:8333 s3api head-bucket --bucket lake 2>/dev/null && echo "bucket ready" && exit 0
          aws --endpoint-url http://s3:8333 s3 mb s3://lake 2>/dev/null && echo "bucket created" && exit 0
          sleep 2
        done
        echo "S3 never became ready" && exit 1
    restart: "no"

  spark-streaming:
    build:
      context: .
      dockerfile: infra/spark/Dockerfile
    depends_on:
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      s3-init: {condition: service_completed_successfully}
      connect-init: {condition: service_completed_successfully}
    environment:
      <<: *lake-env
      CHECKPOINT_DIR: /checkpoints/reconstream
      SPARK_SHUFFLE_PARTITIONS: "4"
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[4]
      - --driver-memory
      - 3g
      - /app/reconstream/jobs/streaming_job.py
    ports: ["4040:4040"]
    volumes: [checkpoints:/checkpoints]
    restart: unless-stopped

  trino:
    image: trinodb/trino:455
    depends_on:
      postgres: {condition: service_healthy}
      s3-init: {condition: service_completed_successfully}
    ports: ["8080:8080"]
    volumes:
      - ./infra/trino/catalog/lake.properties:/etc/trino/catalog/lake.properties:ro

  # ---------- orchestration ----------
  airflow:
    build:
      context: .
      dockerfile: infra/airflow/Dockerfile
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      <<: *lake-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://recon:recon@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: reconstream-local-only
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        (airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true) &&
        (airflow scheduler &) &&
        exec airflow webserver
    ports: ["8081:8080"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./reconstream:/opt/reconstream/reconstream:ro
      - ./dbt:/opt/dbt:ro

  # ---------- observability ----------
  pushgateway:
    image: prom/pushgateway:v1.10.0
    ports: ["9091:9091"]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/reconstream.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

  # ---------- traffic ----------
  generator:
    build: ./generator
    depends_on:
      webhook: {condition: service_healthy}
      connect-init: {condition: service_completed_successfully}
    environment:
      BOOKINGS_DSN: postgresql://recon:recon@postgres:5432/bookings
      WEBHOOK_URL: http://webhook:8000/webhooks/payments
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-secret}
      RECON_SLA_MINUTES: ${RECON_SLA_MINUTES:-2}
      GEN_RATE: ${GEN_RATE:-2}
    restart: unless-stopped

  # Run on demand: docker compose run --rm evaluator
  evaluator:
    build: ./evaluation
    profiles: ["tools"]
    environment:
      BOOKINGS_DSN: postgresql://recon:recon@postgres:5432/bookings
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      EVAL_SINCE_MINUTES: ${EVAL_SINCE_MINUTES:-0}
    volumes:
      - ./evaluation:/out
    command: ["--out", "/out/results.md"]

volumes:
  pgdata:
  kafkadata:
  s3data:
  checkpoints:
