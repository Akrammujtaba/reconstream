# Keep Spark logs readable: pipeline output at INFO (Python logging), JVM noise at WARN,
# and silence known-harmless warnings.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

# "initialized without view support": the project uses no Iceberg views.
logger.jdbccatalog.name = org.apache.iceberg.jdbc.JdbcCatalog
logger.jdbccatalog.level = error
# "Unclosed S3FileIO instance": leak-detector warning printed on garbage collection.
logger.s3fileio.name = org.apache.iceberg.aws.s3.S3FileIO
logger.s3fileio.level = error
logger.nativecode.name = org.apache.hadoop.util.NativeCodeLoader
logger.nativecode.level = error
logger.adminconfig.name = org.apache.kafka.clients.admin.AdminClientConfig
logger.adminconfig.level = error
logger.resolvewrite.name = org.apache.spark.sql.execution.streaming.ResolveWriteToStream
logger.resolvewrite.level = error
