name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install ruff==0.8.4
      - run: ruff check .

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: pytest

  dbt:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: dbt}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install "dbt-core==1.9.*" "dbt-duckdb==1.9.*"
      - run: mkdir -p target
      - run: dbt seed --target ci --profiles-dir .
      - run: dbt build --target ci --profiles-dir .

  airflow-dags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: >
          pip install "apache-airflow==2.10.4"
          --constraint https://raw.githubusercontent.com/apache/airflow/constraints-2.10.4/constraints-3.11.txt
      - name: DAGs import cleanly
        env: {AIRFLOW__CORE__LOAD_EXAMPLES: "false"}
        run: |
          python - <<'PY'
          from airflow.models import DagBag
          bag = DagBag(dag_folder="airflow/dags", include_examples=False)
          assert not bag.import_errors, bag.import_errors
          assert {"reconstream_nightly", "reconstream_maintenance"} <= set(bag.dags)
          print("ok:", sorted(bag.dags))
          PY

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker compose build webhook generator

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: infra/terraform}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
